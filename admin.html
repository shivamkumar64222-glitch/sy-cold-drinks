<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | SY Cold Drinks</title><link rel="stylesheet" href="styles.css"></head>
<body class="admin-body">
<div class="admin-wrap">
  <a class="brand" href="./"><span class="brand-mark">SY</span><span><b>SY Cold Drinks</b><small>STORE ADMINISTRATION</small></span></a>
  <section class="admin-card" id="loginCard"><h1>Admin Login</h1><p>दुकान के Products और Stock को Manage करें।</p>
    <form id="loginForm"><label>Email<input name="email" type="email" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button class="primary-btn full-btn">Login करें →</button><p class="form-message" id="loginMessage"></p></form>
  </section>
  <section id="dashboard" class="hidden">
    <div class="admin-top"><div><span class="eyebrow">CONTROL CENTER</span><h1>Products Dashboard</h1></div><button class="outline-btn" id="logoutBtn">Logout</button></div>
    <div class="admin-panel"><h2 id="productFormTitle">नया Product जोड़ें</h2><form id="productForm">
      <div class="admin-toolbar">
        <label>Product Name<input name="name" required></label><label>Size / Pack<input name="size_label" placeholder="जैसे 750 ml"></label><label>MRP (₹)<input name="mrp" type="number" min="0" step="1" required></label><label>Selling Price (₹)<input name="selling_price" type="number" min="0" step="1" required></label>
        <label>Stock<input name="stock_quantity" type="number" min="0" step="1" required></label><label>Image URL<input name="image_url" type="url" placeholder="https://..."></label><label>Brand<input name="brand"></label><label>Category ID<input name="category_id" type="number" min="1" placeholder="Optional"></label>
      </div>
      <label>Description<input name="description"></label>
      <button class="primary-btn" type="submit">Save Product</button> <button class="outline-btn hidden" type="button" id="cancelEdit">Cancel Edit</button><p class="form-message" id="productMessage"></p>
    </form></div>
    <div class="admin-panel"><div class="admin-top"><h2>Product List</h2><button class="outline-btn" id="refreshBtn">Refresh</button></div><div id="productsTable">Loading…</div></div>
    <p><a href="./">← Customer Website</a></p>
  </section>
</div><script src="admin.js"></script></body></html>
